name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'kev-model-systemone-serverless' }}
  CDK_VERSION: 2.1144.0
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - run: uv run pytest -q

  # Bucket and ingest state machine. The image is built from this bucket, so it is deployed first.
  deploy-model:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --no-dev

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: corepack enable pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pnpm
          key: pnpm-dlx-cdk-${{ env.CDK_VERSION }}

      - name: Bootstrap CDK if the account/region is not bootstrapped
        run: |
          aws cloudformation describe-stacks --stack-name CDKToolkit > /dev/null 2>&1 \
            || pnpm dlx aws-cdk@${CDK_VERSION} bootstrap

      - run: pnpm dlx aws-cdk@${CDK_VERSION} deploy KevModelStack --require-approval never

  # The image is tagged <git tree hash of container/>-<fingerprint of the S3 model files>, so it is rebuilt only when
  # either changes. An empty bucket (model not ingested yet) leaves the tag empty and skips the build and the app deploy.
  build-and-push:
    needs: deploy-model
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: tag
        name: Compute the image tag from container/ and the model files in S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name KevModelStack \
            --query "Stacks[0].Outputs[?OutputKey=='ModelBucketName'].OutputValue" --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          COUNT=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix models/ --query KeyCount --output text)
          if [ "$COUNT" = "0" ]; then
            echo "::warning::No model files in s3://$BUCKET/models/. Run the 'ingest' workflow, then this one."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TREE=$(git rev-parse HEAD:container)
          MODEL=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix models/ \
            --query 'Contents[].[Key,Size,ETag]' --output text | sort | sha256sum | cut -c1-12)
          echo "tag=${TREE:0:12}-${MODEL}" >> "$GITHUB_OUTPUT"

      - if: steps.tag.outputs.tag != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - if: steps.tag.outputs.tag != ''
        name: Create the ECR repository if it does not exist
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > /dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=false

      - if: steps.tag.outputs.tag != ''
        id: exists
        name: Look for an image with this tag
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found == 'false'
        name: Download the model into the build context
        run: aws s3 sync "s3://${{ steps.tag.outputs.bucket }}/models/" container/model/ --only-show-errors

      - if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v4

      # Lambda rejects OCI image indexes, so provenance and SBOM attestations stay off.
      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: container
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-app:
    needs: build-and-push
    if: needs.build-and-push.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --no-dev

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: corepack enable pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pnpm
          key: pnpm-dlx-cdk-${{ env.CDK_VERSION }}

      - name: Deploy
        run: |
          pnpm dlx aws-cdk@${CDK_VERSION} deploy KevSystemOneStack --require-approval never --outputs-file cdk-outputs.json \
            -c imageTag="${{ needs.build-and-push.outputs.tag }}" -c ecrRepository="$ECR_REPOSITORY"

      - name: Summary
        run: |
          {
            echo "### Deployed $GITHUB_SHA (image ${{ needs.build-and-push.outputs.tag }})"
            echo "- API: $(jq -r '.KevSystemOneStack.ApiUrl' cdk-outputs.json)"
            echo "- API key id: $(jq -r '.KevSystemOneStack.ApiKeyId' cdk-outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"
