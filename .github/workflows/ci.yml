name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'kev-model-systemone-serverless' }}
  STACK: KevSystemOneStack
  CDK_VERSION: 2.1144.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - run: uv run pytest -q

  # The image is tagged with the git tree hash of container/, so it is rebuilt only when that directory changes.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=$(git rev-parse HEAD:container)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create the ECR repository if it does not exist
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > /dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=false

      - id: exists
        name: Look for an image with this tag
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v4

      # Lambda rejects OCI image indexes, so provenance and SBOM attestations stay off.
      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: container
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --no-dev

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Enable pnpm
        run: corepack enable pnpm

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pnpm
          key: pnpm-dlx-cdk-${{ env.CDK_VERSION }}

      - name: Bootstrap CDK if the account/region is not bootstrapped
        run: |
          aws cloudformation describe-stacks --stack-name CDKToolkit > /dev/null 2>&1 \
            || pnpm dlx aws-cdk@${CDK_VERSION} bootstrap

      - name: Deploy
        run: |
          pnpm dlx aws-cdk@${CDK_VERSION} deploy "$STACK" --require-approval never --outputs-file cdk-outputs.json \
            -c imageTag="${{ needs.build-and-push.outputs.tag }}" -c ecrRepository="$ECR_REPOSITORY"

      - name: Copy the model from Hugging Face to S3
        run: |
          ARN=$(jq -r --arg s "$STACK" '.[$s].IngestStateMachineArn' cdk-outputs.json)
          EXEC=$(aws stepfunctions start-execution --state-machine-arn "$ARN" --input '{}' --query executionArn --output text)
          for _ in $(seq 1 120); do
            STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXEC" --query status --output text)
            [ "$STATUS" != RUNNING ] && break
            sleep 15
          done
          echo "ingest execution: $STATUS"
          [ "$STATUS" = SUCCEEDED ]

      - name: Summary
        run: |
          {
            echo "### Deployed $GITHUB_SHA (image ${{ needs.build-and-push.outputs.tag }})"
            echo "- API: $(jq -r --arg s "$STACK" '.[$s].ApiUrl' cdk-outputs.json)"
            echo "- API key id: $(jq -r --arg s "$STACK" '.[$s].ApiKeyId' cdk-outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"
