name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'kev-model-systemone-serverless' }}
  CDK_VERSION: 2.1144.0
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - run: uv run pytest -q

  # Bucket and ingest state machine.
  deploy-model:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --no-dev

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: corepack enable pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pnpm
          key: pnpm-dlx-cdk-${{ env.CDK_VERSION }}

      - name: Bootstrap CDK if the account/region is not bootstrapped
        run: |
          aws cloudformation describe-stacks --stack-name CDKToolkit > /dev/null 2>&1 \
            || pnpm dlx aws-cdk@${CDK_VERSION} bootstrap

      - run: pnpm dlx aws-cdk@${CDK_VERSION} deploy KevModelStack --require-approval never

  # The image is tagged with the git tree hash of container/, so it is rebuilt only when that directory changes.
  # The model is not in the image: the Lambda downloads it from S3 at start-up.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=$(git rev-parse HEAD:container)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create the ECR repository if it does not exist
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > /dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=false

      - id: exists
        name: Look for an image with this tag
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v4

      # Lambda rejects OCI image indexes, so provenance and SBOM attestations stay off.
      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: container
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-app:
    needs: [deploy-model, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --no-dev

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: corepack enable pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pnpm
          key: pnpm-dlx-cdk-${{ env.CDK_VERSION }}

      - name: Deploy
        run: |
          pnpm dlx aws-cdk@${CDK_VERSION} deploy KevSystemOneStack --require-approval never --outputs-file cdk-outputs.json \
            -c imageTag="${{ needs.build-and-push.outputs.tag }}" -c ecrRepository="$ECR_REPOSITORY" \
            -c provisionedConcurrency="${{ vars.PROVISIONED_CONCURRENCY || '0' }}"

      # Calls the deployed API with the API key. Without provisioned concurrency the first call is a cold start of
      # about 90 s, which response streaming (integration timeout 150 s) allows.
      - name: Smoke test
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name KevModelStack \
            --query "Stacks[0].Outputs[?OutputKey=='ModelBucketName'].OutputValue" --output text)
          COUNT=$(aws s3 ls "s3://$BUCKET/models/" --recursive | wc -l || true)
          if [ "${COUNT// /}" = "0" ]; then
            echo "::warning::No model files in s3://$BUCKET/models/; run the 'ingest' workflow. Skipping the smoke test."
            exit 0
          fi
          URL=$(jq -r '.KevSystemOneStack.ApiUrl' cdk-outputs.json)v1/systemone
          KEY=$(aws apigateway get-api-key --api-key "$(jq -r '.KevSystemOneStack.ApiKeyId' cdk-outputs.json)" \
            --include-value --query value --output text)
          echo "::add-mask::$KEY"
          BODY='{"state": "I was charged twice for order 1182.", "questions": {"urgent": {"type": "noul", "instructions": "Does this need a reply today?"}}}'
          for attempt in 1 2; do
            CODE=$(curl -sS -o out.json -w '%{http_code}' --max-time 240 -X POST "$URL" \
              -H "x-api-key: $KEY" -H "content-type: application/json" -d "$BODY" || true)
            echo "attempt $attempt: HTTP $CODE"
            [ "$CODE" = 200 ] && break
            head -c 500 out.json || true; echo
          done
          [ "$CODE" = 200 ]
          jq -e '.answers.urgent.type == "noul"' out.json

      - name: Summary
        run: |
          {
            echo "### Deployed $GITHUB_SHA (image ${{ needs.build-and-push.outputs.tag }})"
            echo "- API: $(jq -r '.KevSystemOneStack.ApiUrl' cdk-outputs.json)"
            echo "- API key id: $(jq -r '.KevSystemOneStack.ApiKeyId' cdk-outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"
